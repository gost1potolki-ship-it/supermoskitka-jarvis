rules:
  - id: SM-SAFE-001
    title: Обязательное предупреждение по Антикошке
    category: safety
    status: approved
    activeVersion: 1
    tags:
      - anticat
      - safety
      - critical
    versions:
      - version: 1
        condition: клиент спрашивает, защитит ли Антикошка от выпадения
        instruction: Использовать утверждённое предупреждение. Не утверждать, что сетка гарантированно
          удержит ребёнка или животное.
        source:
          type: owner
          reference: business-audit-2026
        createdAt: 2026-08-12T00:00:00.000Z
        approvedAt: 2026-08-12T00:00:00.000Z
        responseTemplate: Это всё равно москитная сетка, а не защитная решётка. Она не является гарантией от
          выпадения ребёнка или домашнего животного, поэтому рядом с открытым окном их нельзя
          оставлять без присмотра.
