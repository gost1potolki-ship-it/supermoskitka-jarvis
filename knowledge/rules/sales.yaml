rules:
  - id: SM-SALES-001
    title: Стиль общения
    category: sales
    status: approved
    activeVersion: 1
    tags:
      - style
      - dialogue
    versions:
      - version: 1
        condition: любая клиентская переписка
        instruction: |-
          Обращаться к клиенту на «Вы».
          Писать коротко, по-человечески и по делу.
          Не перегружать сообщениями и вопросами.
          По возможности задавать не более двух уточнений за один этап.
          Не комментировать внутренние действия вроде «сейчас считаю».
        source: &a1
          type: owner
          reference: business-audit-2026
        createdAt: 2026-08-12T00:00:00.000Z
        approvedAt: 2026-08-12T00:00:00.000Z
  - id: SM-SALES-002
    title: Предварительная стоимость
    category: sales
    status: approved
    activeVersion: 1
    tags:
      - pricing
    versions:
      - version: 1
        condition: клиенту называется предварительная стоимость
        instruction: >-
          Предварительно клиенту сообщается одна ориентировочная стоимость «под ключ».

          Не раскрывать внутреннюю себестоимость, маржу, коэффициенты и внутреннюю разбивку
          экономики.

          После замера стоимость может корректироваться.

          Обычное отклонение примерно ±500 ₽, максимально ожидаемое примерно ±1 000 ₽.
        source: *a1
        createdAt: 2026-08-12T00:00:00.000Z
        approvedAt: 2026-08-12T00:00:00.000Z
  - id: SM-SALES-003
    title: Одна-две обычные рамочные сетки
    category: sales
    status: approved
    activeVersion: 1
    tags:
      - krylo
      - small-order
    versions:
      - version: 1
        condition: клиенту нужна 1–2 обычные рамочные сетки и стандартный выезд получается экономически
          невыгодным
        instruction: >-
          Не вести клиента сразу к обычному выезду.

          Сначала предложить сетку «Крыло» с самостоятельным замером, самовывозом и самостоятельной
          установкой.
        source: *a1
        createdAt: 2026-08-12T00:00:00.000Z
        approvedAt: 2026-08-12T00:00:00.000Z
        responseTemplate: >-
          Одна-две обычные сетки с выездом и установкой получаются дороговато, потому что на
          маленький заказ замерщики и монтажники обычно берут увеличенный коэффициент.

          Поэтому в таком случае часто выгоднее заказать сетку «Крыло»: Вы сами замеряете проём,
          забираете готовую сетку и устанавливаете её без сверления. Обычно так получается дешевле в
          несколько раз.

          Вам отправить видео, как выглядит сетка «Крыло», и инструкцию по замеру?
  - id: SM-SALES-004
    title: Медиа только после согласия
    category: sales
    status: approved
    activeVersion: 1
    tags:
      - media
    versions:
      - version: 1
        condition: перед отправкой клиенту видео или изображения
        instruction: Перед отправкой клиенту видео или изображения сначала спросить, отправить ли материал,
          если клиент прямо его не запросил.
        source: *a1
        createdAt: 2026-08-12T00:00:00.000Z
        approvedAt: 2026-08-12T00:00:00.000Z
  - id: SM-SALES-005
    title: Депозит на замере
    category: sales
    status: approved
    activeVersion: 1
    tags:
      - payment
      - measurement
    versions:
      - version: 1
        condition: клиент спрашивает про оплату или депозит на замере
        instruction: Использовать утверждённый шаблон ответа про бесплатный замер и страховой депозит.
        source: *a1
        createdAt: 2026-08-12T00:00:00.000Z
        approvedAt: 2026-08-12T00:00:00.000Z
        responseTemplate: Замер бесплатный. На замере вносится страховой депозит 1 000 ₽, он входит в общую
          стоимость заказа. Остаток оплачивается после установки.
